# Blazecoin Core — default configuration (blazecoin.conf)
# =========================================================
# Copy this into the Blazecoin data directory and restart the daemon:
#   Windows : %APPDATA%\BlazecoinV2.0\blazecoin.conf
#             (newer installs may use %LOCALAPPDATA%\BlazecoinV2.0\)
#   macOS   : ~/Library/Application Support/BlazecoinV2.0/blazecoin.conf
#   (or run blazecoind with -datadir=<path> and put it there)
#
# This sets ONLY the values a fresh Blazecoin node needs that are not already
# the compiled-in defaults. Network ports are intentionally omitted so the
# production code defaults apply automatically: mainnet RPC 55413 / P2P 55414.

# === RPC server ===========================================================
# Required so the wallet GUI and blazecoin-cli can talk to the daemon.
server=1

# Accept RPC connections from this machine only. Never expose RPC to the
# internet — anyone who can reach it can spend your coins.
rpcallowip=127.0.0.1

# RPC authentication — COOKIE AUTH (recommended; the default here).
# With no rpcuser/rpcpassword set, the daemon writes a fresh random secret to
# `.cookie` in the data directory on every start. The wallet GUI reads that
# cookie automatically, so there is NO shared password to ship or leak.
#   - Do NOT set rpcuser/rpcpassword unless a separate client (e.g. a remote
#     miner / solo proxy that can't read the cookie) needs fixed credentials —
#     in which case generate a UNIQUE random password per install (or use
#     `rpcauth=`), never a shared default.
# (rpcuser/rpcpassword intentionally left unset → cookie auth.)

# === Wallet ===============================================================
# Auto-load this wallet at startup. Core 28 no longer creates a default wallet
# automatically, so without this the first getbalance / getnewaddress after a
# cold start returns RPC error -18 "No wallet is loaded" (which surfaces as a
# connection error in the GUI). The named wallet must already exist on disk —
# the wallet GUI creates "Primary" on first run.
wallet=Primary

# CRITICAL — keep addresses legacy (B...). Blazecoin consensus has SegWit
# disabled (SegwitHeight = INT_MAX), so bech32 "blz1..." addresses are
# unspendable: sending funds to one loses them PERMANENTLY. The compiled
# default IS already legacy (DEFAULT_ADDRESS_TYPE = LEGACY in
# src/wallet/wallet.h, commit 51916d7b9f), so these two lines are
# belt-and-suspenders — keep the explicit pin anyway: blz1 addresses are
# unsafe on this chain, and the pin also protects any older binary.
addresstype=legacy
changetype=legacy

# === Fees =================================================================
# Blazecoin has very low activity, so Core's fee estimator never has data.
# Since the 2026-07-18 build (d892d945) the BINARY default is
# fallbackfee=1000 sat/kvB, so a fresh no-conf wallet can already send — the
# line below is a redundant safety pin, not a requirement; it overrides to
# the original 0.8.x flat 0.001 BLZ/kvB fee for THIS wallet's own sends
# (fallbackfee = fee when estimation has no data; mintxfee = floor the
# wallet pays), and keeps sends working on any OLDER binary where
# fallbackfee defaulted to disabled. blockmintxfee=0 is already the code
# default, so 0-fee txs get mined without any entry here.
fallbackfee=0.001
mintxfee=0.001

# V1.5 free-send RELAY. As of the 2026-07-06 build this is ALSO the code default
# (DEFAULT_MIN_RELAY_TX_FEE=0 with DEFAULT_INCREMENTAL_RELAY_FEE=0, so nothing
# re-floors it at startup — audit finding D3, now fixed in-binary), so this line
# is belt-and-suspenders. Keep it: it also enables 0-fee relay on any OLDER binary
# where minrelaytxfee=0 was silently raised back to the 0.00001 incremental floor.
# (See BLAZECOIN_DESIGN_AUDIT.md finding D3 / feature_blazecoin_policy_defaults.py.)
minrelaytxfee=0

# === Chain / sync =========================================================
# Blazecoin's hashrate is low; the chain frequently goes days without a block.
# Without this, the node treats an aged tip as "still in initial sync" forever,
# which blocks the wallet/mempool RPCs that gate on !IsInitialBlockDownload().
# 99999999 seconds (~3.17 years) effectively disables that staleness check.
maxtipage=99999999

# === Peers ================================================================
# Seed nodes to bootstrap the peer list on a fresh install. The hostname
# auto-resolves to the current peer set; the IPs are static fallbacks.
# (Since 2026-08-10 the two OVH relays below are also baked into the binary's
# vSeeds/fixed seeds — listing them here just makes a fresh conf self-sufficient.)
addnode=blazecoin.co.uk:55414
addnode=51.210.47.141:55414
addnode=54.39.23.245:55414
addnode=85.15.179.171:55414
addnode=91.206.16.214:55414

# === Performance (optional, sensible defaults) ============================
dbcache=500
maxconnections=20

# A legacy-wallet import rescans the whole chain (~40 min) and, with the default
# 4 RPC threads / 16-deep work queue, can saturate RPC and starve the GUI's
# pollers ("http work queue depth exceeded"). Extra headroom keeps the UI
# responsive during long rescans.
rpcthreads=8
rpcworkqueue=64
